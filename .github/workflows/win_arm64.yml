name: Build for Windows ARM64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "tag (empty = build only, no release)"
        required: false
        default: ""
        type: string

concurrency:
  group: win-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-arm64:
    name: Release Windows ARM64
    # GitHub-hosted arm64 Windows runner: Flutter cross-compiles to windows-arm64
    # only from an arm64 host (gen_snapshot has to run natively).
    runs-on: windows-11-arm
    permissions:
      contents: write
    env:
      # Flutter selects the Windows target arch from the host; the SDK shipped
      # for Windows is x64-only, so lib/scripts/patch_flutter_arm64.ps1 backports
      # FLUTTER_HOST_ARCH support and this makes the tool build for arm64.
      FLUTTER_HOST_ARCH: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          # Flutter only publishes x64 Windows SDK archives. The x64 SDK runs on
          # arm64 Windows through emulation and still cross-compiles to
          # windows-arm64 (see FLUTTER_HOST_ARCH below).
          architecture: x64
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          "host arch : $env:PROCESSOR_ARCHITECTURE"
          flutter --version
          flutter config --enable-windows-desktop
          flutter doctor -v
          exit 0

      - name: Patch flutter tool for windows-arm64
        shell: pwsh
        run: lib/scripts/patch_flutter_arm64.ps1

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Apply Windows ARM64 Patch
        shell: pwsh
        run: lib/scripts/patch_win_arm64.ps1

      - name: Prepare media_kit native libraries
        shell: pwsh
        run: |
          # media_kit_libs_windows_video downloads + unpacks these archives from
          # its CMakeLists.txt, but CMake's liblzma cannot read the ARM64 archives
          # and MSBuild swallows the failure of the custom command. Download and
          # extract them here instead: the plugin re-verifies the MD5 and skips
          # both steps when the archive and the extracted directory are present.
          $bin = Join-Path $PWD 'build\windows\arm64'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $sevenZip = @('C:\Program Files\7-Zip\7z.exe', 'C:\Program Files (x86)\7-Zip\7z.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1

          $archives = @(
            @{
              Name   = 'mpv-dev-aarch64-20260607-git-43b14a4.7z'
              Md5    = 'e4c49712b9cf0d77e1ae8e1a9c8e3ed7'
              Url    = 'https://github.com/bggRGjQaUbCoE/mpv-winbuild-cmake/releases/download/20260607/mpv-dev-aarch64-20260607-git-43b14a4.7z'
              Dir    = 'libmpv'
              Marker = 'libmpv-2.dll'
            },
            @{
              Name   = 'ANGLE_WINARM64.7z'
              Md5    = 'b56aaae894ccf6c8ee90b59ee642a787'
              Url    = 'https://github.com/talynone/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE_WINARM64.7z'
              Dir    = 'ANGLE'
              Marker = 'libEGL.dll'
            }
          )

          foreach ($archive in $archives) {
            $file = Join-Path $bin $archive.Name
            if (-not (Test-Path $file)) {
              Write-Host "downloading $($archive.Url)"
              Invoke-WebRequest -Uri $archive.Url -OutFile $file
            }
            $hash = (Get-FileHash $file -Algorithm MD5).Hash.ToLowerInvariant()
            if ($hash -ne $archive.Md5) { throw "MD5 mismatch for $($archive.Name): $hash" }

            $destination = Join-Path $bin $archive.Dir
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            if (Test-Path (Join-Path $destination $archive.Marker)) {
              Write-Host "already extracted: $($archive.Name)"
            } else {
              if ($sevenZip) {
                & $sevenZip x -y "-o$destination" $file | Select-Object -Last 2
              } else {
                & "$env:SystemRoot\System32\tar.exe" -xf $file -C $destination
              }
              if ($LASTEXITCODE -ne 0) { throw "failed to extract $($archive.Name) (exit $LASTEXITCODE)" }
              Get-ChildItem $destination | ForEach-Object { "  $($_.Name)" }
            }
            # The mpv headers are nested in include/mpv, but media_kit_video and
            # media_kit_native_event_loop include "client.h" from
            # ${CMAKE_BINARY_DIR}/libmpv/include, which is what the upstream
            # xcopy/ren dance in the plugin CMakeLists produces as well.
            $nested = Join-Path $destination 'include\mpv'
            if (Test-Path $nested) {
              Get-ChildItem $nested -File | Move-Item -Destination (Join-Path $destination 'include') -Force
              Remove-Item $nested -Recurse -Force
              Write-Host "flattened libmpv headers into $destination\include"
            }
          }

      - name: Verify target architecture
        shell: pwsh
        run: |
          "FLUTTER_HOST_ARCH=$env:FLUTTER_HOST_ARCH"
          "flutter      : $((Get-Command flutter).Source)"
          $probe = Join-Path $env:RUNNER_TEMP 'env_probe.dart'
          "import 'dart:io';`nvoid main() { print('dart sees FLUTTER_HOST_ARCH=' + (Platform.environment['FLUTTER_HOST_ARCH'] ?? 'NULL')); }" | Set-Content $probe -Encoding utf8
          & "$env:FLUTTER_ROOT\bin\cache\dart-sdk\bin\dart.exe" $probe
          flutter -v build windows --release --config-only --dart-define-from-file=pili_release.json --no-pub 2>&1 |
            Select-String -Pattern 'cmake|-A |FLUTTER_TARGET_PLATFORM|windows-arm64' | Select-Object -First 40 |
            ForEach-Object { $_.Line.Trim() }
          Get-ChildItem 'build\windows' -Directory -ErrorAction SilentlyContinue | ForEach-Object { "build dir: $($_.Name)" }
          if (-not (Test-Path 'build\windows\arm64')) { throw 'flutter did not target windows-arm64' }

      - name: Build Windows ARM64
        shell: pwsh
        run: |
          flutter build windows --release --dart-define-from-file=pili_release.json --no-pub

      - name: Compile installer
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\arm64\runner\Release'
          if (-not (Test-Path $releaseDir)) { throw "build output not found: $releaseDir" }

          $isccCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 5\ISCC.exe'
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }

          $innoDir = Split-Path $iscc -Parent
          Copy-Item 'windows\packaging\exe\ChineseSimplified.isl' (Join-Path $innoDir 'Languages\ChineseSimplified.isl') -Force

          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'dist') | Out-Null
          & $iscc `
            "/DAppVersion=$env:version" `
            "/DSourceDir=$releaseDir" `
            "/DOutputDir=$(Join-Path $PWD 'dist')" `
            "/DOutputBaseFilename=PiliPlus_windows_$($env:version)_arm64_setup" `
            'windows\packaging\exe\inno_setup_arm64.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          Get-ChildItem 'dist' | ForEach-Object { "built: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Compress portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'Release\PiliPlus-Win' | Out-Null
          Copy-Item 'build\windows\arm64\runner\Release\*' 'Release\PiliPlus-Win\' -Recurse -Force
          Compress-Archive -Path 'Release\PiliPlus-Win' -DestinationPath "PiliPlus_windows_$($env:version)_arm64_portable.zip" -Force

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            PiliPlus_windows_*_arm64_portable.zip
            dist/PiliPlus_windows_*_arm64_setup.exe

      - name: Upload windows arm64 setup
        uses: actions/upload-artifact@v7
        with:
          name: Windows-setup-arm64-release
          path: dist/PiliPlus_windows_*_arm64_setup.exe

      - name: Upload windows arm64 portable
        uses: actions/upload-artifact@v7
        with:
          name: Windows-file-arm64-release
          path: PiliPlus_windows_*_arm64_portable.zip
